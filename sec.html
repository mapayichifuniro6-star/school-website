<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduHome Malawi · Learn From Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #eaf4ff 0%, #d6e8f7 40%, #c2d9ed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }
        /* Decorative background graphics */
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            right: -10%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(138, 184, 217, 0.25) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -12%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(25, 100, 126, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 620px;
            border-radius: 2rem;
            padding: 2.8rem 2.4rem;
            box-shadow: 0 30px 60px -18px rgba(11, 47, 68, 0.45),
                        0 0 0 1px rgba(255, 255, 255, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .card.wide {
            max-width: 1150px;
            padding: 2.2rem 2.6rem 2.8rem;
        }
        .card h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0b2f44;
            margin-bottom: 0.4rem;
        }
        .card .subhead {
            font-size: 1rem;
            color: #3e5e72;
            margin-bottom: 2rem;
            border-left: 3px solid #8ab8d9;
            padding-left: 1rem;
            background: rgba(138, 184, 217, 0.1);
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 1.4rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1c4b66;
            margin-bottom: 0.5rem;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 0.95rem 1.3rem;
            font-size: 1rem;
            background: white;
            border: 1.5px solid #cbdae5;
            border-radius: 3rem;
            outline: none;
            transition: 0.25s;
            color: #0d2e40;
            font-family: 'Times New Roman', Times, serif;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #2e7ea0;
            box-shadow: 0 0 0 5px rgba(46, 126, 160, 0.15);
        }
        .input-group input::placeholder {
            color: #a3b9c9;
            font-weight: 300;
            font-style: italic;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn {
            width: 100%;
            padding: 0.95rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 3rem;
            background: #19647e;
            color: white;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
            box-shadow: 0 8px 20px -6px rgba(25, 100, 126, 0.45);
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
            font-family: 'Times New Roman', Times, serif;
        }
        .btn:hover {
            background: #0f4b61;
            box-shadow: 0 10px 24px -6px rgba(25, 100, 126, 0.6);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #e5eff6;
            color: #19647e;
            box-shadow: none;
            border: 1.5px solid #b9d2e3;
        }
        .btn-secondary:hover {
            background: #d3e4f0;
            color: #0f4b61;
        }
        .switch-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 1rem;
            color: #2b5c76;
        }
        .switch-link a {
            color: #19647e;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .switch-link a:hover {
            border-bottom-color: #19647e;
        }
        .message {
            font-size: 0.95rem;
            padding: 0.9rem 1.3rem;
            border-radius: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #ffffffcc;
            backdrop-filter: blur(2px);
            line-height: 1.5;
        }
        .message.error {
            background: #ffeeee;
            color: #b33a3a;
            border-left: 5px solid #d14b4b;
        }
        .message.success {
            background: #e3f5e9;
            color: #1f6e4a;
            border-left: 5px solid #2d8f5c;
        }
        .message.info {
            background: #e6f0fa;
            color: #1f5a7a;
            border-left: 5px solid #3d84a8;
        }
        .small-note {
            font-size: 0.8rem;
            text-align: center;
            color: #608a9e;
            margin-top: 1.6rem;
            font-style: italic;
        }
        .step-badge {
            display: inline-block;
            background: #19647e;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 1rem;
            border-radius: 2rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        .password-hint {
            font-size: 0.75rem;
            color: #628b9c;
            margin-top: 0.35rem;
            padding-left: 0.9rem;
            font-style: italic;
        }
        /* ===== BEAUTIFUL LOGIN PAGE ===== */
        .login-card {
            background: linear-gradient(135deg, #ffffff 0%, #f4f9ff 100%);
            border-radius: 2rem;
            padding: 3rem 2.8rem;
            box-shadow: 0 30px 55px -18px rgba(15, 60, 100, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.9),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
            max-width: 480px;
            margin: 0 auto;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(25, 100, 126, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(138, 184, 217, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
            position: relative;
            z-index: 1;
        }
        .login-header .icon {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 0.6rem;
            filter: drop-shadow(0 4px 6px rgba(25, 100, 126, 0.2));
        }
        .login-header h2 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0b2f44;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
        }
        .login-header .tagline {
            font-size: 1rem;
            color: #5f7f93;
            font-style: italic;
            letter-spacing: 0.3px;
        }
        .login-form {
            position: relative;
            z-index: 1;
        }
        .login-form .input-group {
            margin-bottom: 1.6rem;
            position: relative;
        }
        .login-form .input-group label {
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: #2a5a75;
            margin-bottom: 0.6rem;
            font-weight: 700;
        }
        .login-form .input-group input {
            padding: 1rem 1.4rem;
            font-size: 1.05rem;
            border: 2px solid #d7e6f0;
            border-radius: 3rem;
            background: rgba(255, 255, 255, 0.85);
            transition: all 0.3s ease;
        }
        .login-form .input-group input:focus {
            border-color: #19647e;
            box-shadow: 0 0 0 5px rgba(25, 100, 126, 0.12);
            background: white;
        }
        .login-form .input-group input::placeholder {
            color: #b0c6d4;
            font-style: italic;
            font-size: 0.95rem;
        }
        .login-form .btn-login {
            width: 100%;
            padding: 1.1rem;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            border-radius: 3rem;
            background: linear-gradient(135deg, #19647e 0%, #2a7f9e 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -8px rgba(25, 100, 126, 0.55);
            margin-top: 0.8rem;
            position: relative;
            overflow: hidden;
        }
        .login-form .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .login-form .btn-login:hover {
            background: linear-gradient(135deg, #0f4b61 0%, #1c6a88 100%);
            box-shadow: 0 14px 30px -8px rgba(25, 100, 126, 0.7);
            transform: translateY(-1px);
        }
        .login-form .btn-login:hover::after {
            left: 100%;
        }
        .login-form .btn-login:active {
            transform: scale(0.98) translateY(0);
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.8rem 0 1.2rem;
            color: #9ab5c7;
            font-size: 0.85rem;
            font-style: italic;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #cbdae5, transparent);
        }
        .login-switch {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 1rem;
            color: #3e6d85;
        }
        .login-switch a {
            color: #19647e;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .login-switch a:hover {
            border-bottom-color: #19647e;
        }
        .login-note {
            font-size: 0.78rem;
            text-align: center;
            color: #7f9fb3;
            margin-top: 1.8rem;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        /* ===== DASHBOARD / SUBJECTS PAGE ===== */
        .dashboard {
            position: relative;
        }
        .dash-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.6rem;
            flex-wrap: wrap;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }
        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #19647e, #2a7f9e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 8px 18px -6px rgba(25, 100, 126, 0.6);
            flex-shrink: 0;
        }
        .brand-text h1 {
            font-size: 1.4rem;
            color: #0b2f44;
            font-weight: 700;
            line-height: 1.1;
        }
        .brand-text p {
            font-size: 0.8rem;
            color: #5f7f93;
            font-style: italic;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: #f2f8fd;
            border: 1px solid #d7e6f0;
            padding: 0.45rem 0.5rem 0.45rem 1rem;
            border-radius: 3rem;
        }
        .user-chip .who {
            font-size: 0.9rem;
            color: #1c4b66;
        }
        .user-chip .who strong {
            color: #0b2f44;
        }
        .logout-small {
            background: #19647e;
            color: white;
            border: none;
            padding: 0.55rem 1.3rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.5px;
        }
        .logout-small:hover {
            background: #0f4b61;
        }

        /* Hero / Video section */
        .hero {
            background: linear-gradient(135deg, #0b2f44 0%, #19647e 55%, #2a7f9e 100%);
            border-radius: 1.8rem;
            padding: 1.8rem;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -18px rgba(11, 47, 68, 0.6);
            margin-bottom: 2rem;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 50%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -60%;
            left: -10%;
            width: 55%;
            height: 200%;
            background: radial-gradient(circle, rgba(138, 184, 217, 0.2) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            gap: 1.8rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .hero-text h2 {
            color: white;
            font-size: 1.9rem;
            line-height: 1.2;
            margin-bottom: 0.7rem;
        }
        .hero-text h2 span {
            color: #a8e0ff;
        }
        .hero-text p {
            font-size: 0.98rem;
            color: #d5e9f7;
            line-height: 1.55;
            margin-bottom: 1.3rem;
        }
        .hero-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .hero-pill {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 0.78rem;
            padding: 0.35rem 0.9rem;
            border-radius: 2rem;
            backdrop-filter: blur(4px);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 20px 40px -14px rgba(0, 0, 0, 0.55),
                        0 0 0 3px rgba(255, 255, 255, 0.15);
            background: #041c2b;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.55);
            color: #eaf6ff;
            font-size: 0.75rem;
            padding: 0.35rem 0.9rem;
            border-radius: 2rem;
            z-index: 2;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        /* Subjects section */
        .subjects-section {
            background: #f7fbfe;
            border: 1px solid #d7e6f0;
            border-radius: 1.8rem;
            padding: 1.8rem;
        }
        .subjects-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.3rem;
        }
        .subjects-header h3 {
            font-size: 1.5rem;
            color: #0b2f44;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .subjects-header .count {
            font-size: 0.9rem;
            color: #5f7f93;
            font-style: italic;
        }
        .subject-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.4rem;
        }
        .filter-chip {
            background: white;
            border: 1.5px solid #d7e6f0;
            color: #2b5c76;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 600;
        }
        .filter-chip:hover {
            border-color: #8ab8d9;
            background: #eef6fc;
        }
        .filter-chip.active {
            background: #19647e;
            color: white;
            border-color: #19647e;
            box-shadow: 0 6px 14px -6px rgba(25, 100, 126, 0.6);
        }
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .subject-card {
            background: white;
            border: 1px solid #d7e6f0;
            border-radius: 1.2rem;
            padding: 1.2rem 1.2rem 1.1rem;
            transition: all 0.28s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #19647e, #8ab8d9);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        .subject-card:hover {
            box-shadow: 0 18px 34px -16px rgba(15, 60, 100, 0.4);
            transform: translateY(-3px);
            border-color: #b9d2e3;
        }
        .subject-card:hover::before {
            transform: scaleX(1);
        }
        .subject-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.45rem;
            margin-bottom: 0.8rem;
            background: #eaf3fa;
            border: 1px solid #dbe9f3;
        }
        .subject-card h4 {
            font-size: 1.1rem;
            color: #0b2f44;
            margin-bottom: 0.35rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .subject-card p {
            font-size: 0.85rem;
            color: #4c7186;
            line-height: 1.5;
            flex-grow: 1;
        }
        .subject-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.9rem;
            padding-top: 0.7rem;
            border-top: 1px dashed #d7e6f0;
        }
        .subject-meta .level {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #1f5a7a;
            background: #e6f0fa;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
        }
        .subject-meta .lessons {
            font-size: 0.78rem;
            color: #608a9e;
            font-style: italic;
        }
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2.5rem 1rem;
            color: #7f9fb3;
            font-style: italic;
        }
        @media (max-width: 820px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
            .hero-text h2 {
                font-size: 1.6rem;
            }
        }
        @media (max-width: 600px) {
            .card, .card.wide {
                padding: 2rem 1.4rem;
                border-radius: 1.5rem;
            }
            .card h2 {
                font-size: 1.8rem;
            }
            .row-2 {
                grid-template-columns: 1fr;
            }
            .subjects-grid {
                grid-template-columns: 1fr;
            }
            .login-card {
                padding: 2.2rem 1.6rem;
            }
            .dash-topbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero {
                padding: 1.3rem;
            }
            .user-chip {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <!-- dynamic content rendered by JavaScript -->
    </div>

    <script>
        (function() {
            // ---------- storage keys ----------
            const USERS_KEY = 'eduhome_users_v1';

            // ---------- data: Malawi secondary school subjects ----------
            const SUBJECTS = [
                { name: 'Mathematics', icon: '📐', category: 'Sciences', level: 'Form 1–4', lessons: 48, desc: 'Algebra, geometry, trigonometry and calculus fundamentals for national exams.' },
                { name: 'English Language', icon: '📖', category: 'Languages', level: 'Form 1–4', lessons: 42, desc: 'Grammar, comprehension, composition and literature analysis skills.' },
                { name: 'Chichewa', icon: '🗣️', category: 'Languages', level: 'Form 1–4', lessons: 36, desc: 'Malawian national language: reading, writing and oral tradition.' },
                { name: 'Biology', icon: '🧬', category: 'Sciences', level: 'Form 3–4', lessons: 40, desc: 'Cells, genetics, human body systems, ecology and plant biology.' },
                { name: 'Physical Science', icon: '⚛️', category: 'Sciences', level: 'Form 1–2', lessons: 32, desc: 'Foundational chemistry and physics concepts for junior secondary.' },
                { name: 'Chemistry', icon: '🧪', category: 'Sciences', level: 'Form 3–4', lessons: 38, desc: 'Atomic structure, chemical reactions, organic and inorganic chemistry.' },
                { name: 'Physics', icon: '🔭', category: 'Sciences', level: 'Form 3–4', lessons: 39, desc: 'Mechanics, electricity, waves, thermodynamics and modern physics.' },
                { name: 'Geography', icon: '🌍', category: 'Humanities', level: 'Form 1–4', lessons: 34, desc: 'Physical and human geography, map reading and Malawi\'s environment.' },
                { name: 'History', icon: '📜', category: 'Humanities', level: 'Form 1–4', lessons: 30, desc: 'Malawian, African and world history from pre-colonial to modern times.' },
                { name: 'Social Studies', icon: '🤝', category: 'Humanities', level: 'Form 1–2', lessons: 26, desc: 'Citizenship, civic education and understanding society and culture.' },
                { name: 'Bible Knowledge', icon: '✝️', category: 'Humanities', level: 'Form 1–4', lessons: 28, desc: 'Old and New Testament studies and their historical context.' },
                { name: 'Agriculture', icon: '🌱', category: 'Applied', level: 'Form 1–4', lessons: 35, desc: 'Crop production, animal husbandry, soil science and farm management.' },
                { name: 'Biology (Practical)', icon: '🔬', category: 'Applied', level: 'Form 3–4', lessons: 22, desc: 'Laboratory skills, microscopy, dissection and experimental methods.' },
                { name: 'Computer Studies', icon: '💻', category: 'Applied', level: 'Form 1–4', lessons: 33, desc: 'Computer basics, MS Office, programming logic and internet safety.' },
                { name: 'Business Studies', icon: '📊', category: 'Applied', level: 'Form 3–4', lessons: 29, desc: 'Commerce, accounting principles, entrepreneurship and economics.' },
                { name: 'Technical Drawing', icon: '📏', category: 'Applied', level: 'Form 3–4', lessons: 24, desc: 'Geometric construction, orthographic projection and design.' },
                { name: 'Home Economics', icon: '🍲', category: 'Applied', level: 'Form 1–4', lessons: 27, desc: 'Nutrition, food preparation, textiles and family resource management.' },
                { name: 'Music', icon: '🎵', category: 'Creative', level: 'Form 1–4', lessons: 20, desc: 'Theory, appreciation, performance and Malawian musical heritage.' },
                { name: 'Fine Art', icon: '🎨', category: 'Creative', level: 'Form 1–4', lessons: 22, desc: 'Drawing, painting, sculpture and art history appreciation.' },
                { name: 'Physical Education', icon: '⚽', category: 'Creative', level: 'Form 1–4', lessons: 18, desc: 'Sports skills, health, fitness and teamwork through physical activity.' }
            ];

            // ---------- helpers ----------
            function getUsers() {
                try {
                    const stored = localStorage.getItem(USERS_KEY);
                    return stored ? JSON.parse(stored) : {};
                } catch (e) {
                    console.warn('failed to parse users, resetting.');
                    return {};
                }
            }

            function saveUsers(users) {
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- application state ----------
            let currentView = 'register-credentials';
            let pendingUsername = null;
            let pendingPassword = null;
            let loggedInUser = null;
            let message = null;
            let subjectFilter = 'All'; // for filtering subjects

            const app = document.getElementById('app');

            // ---------- message helper ----------
            let messageTimer = null;
            function setMessage(type, text) {
                message = { type, text };
                render();
                if (messageTimer) clearTimeout(messageTimer);
                messageTimer = setTimeout(() => {
                    if (message && message.text === text) {
                        message = null;
                        render();
                    }
                }, 5000);
            }

            // ---------- render function ----------
            function render() {
                const users = getUsers();
                let html = '';

                if (currentView === 'dashboard') {
                    app.classList.add('wide');
                } else {
                    app.classList.remove('wide');
                }

                // ----- message banner -----
                if (message) {
                    const msgClass = message.type === 'error' ? 'error' : message.type === 'success' ? 'success' : 'info';
                    html += `<div class="message ${msgClass}">${escapeHtml(message.text)}</div>`;
                }

                // ============================================================
                // 1. REGISTER : credentials step
                // ============================================================
                if (currentView === 'register-credentials') {
                    html += `
                        <div class="step-badge">STEP 1 OF 2</div>
                        <h2>Join EduHome Malawi</h2>
                        <div class="subhead">Start learning from home. Begin by choosing a username and password.</div>
                        <form id="credentialsForm" autocomplete="off">
                            <div class="input-group">
                                <label for="regUsername">Username</label>
                                <input type="text" id="regUsername" name="username" placeholder="e.g. alex_2025" autocomplete="off" required>
                            </div>
                            <div class="input-group">
                                <label for="regPassword">Password</label>
                                <input type="password" id="regPassword" name="password" placeholder="••••••••" autocomplete="new-password" required>
                                <div class="password-hint">at least 4 characters</div>
                            </div>
                            <button type="submit" class="btn">Continue →</button>
                        </form>
                        <div class="switch-link">
                            Already registered? <a id="goToLoginFromReg">Log in here</a>
                        </div>
                        <div class="small-note">Your progress is saved locally.</div>
                    `;
                }

                // ============================================================
                // 2. REGISTER : personal details step
                // ============================================================
                else if (currentView === 'register-personal') {
                    html += `
                        <div class="step-badge">STEP 2 OF 2</div>
                        <h2>Personal details</h2>
                        <div class="subhead">Tell us a bit about yourself, <strong>${escapeHtml(pendingUsername || 'learner')}</strong>.</div>
                        <form id="personalForm" autocomplete="off">
                            <div class="input-group">
                                <label for="fullName">Full name</label>
                                <input type="text" id="fullName" name="fullName" placeholder="e.g. Alex Johnson" required>
                            </div>
                            <div class="row-2">
                                <div class="input-group">
                                    <label for="age">Age</label>
                                    <input type="number" id="age" name="age" min="5" max="120" placeholder="e.g. 16" required>
                                </div>
                                <div class="input-group">
                                    <label for="gender">Gender</label>
                                    <select id="gender" name="gender" required>
                                        <option value="" disabled selected>Select</option>
                                        <option value="Female">Female</option>
                                        <option value="Male">Male</option>
                                        <option value="Other">Other</option>
                                        <option value="Prefer not to say">Prefer not to say</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label for="email">Email address</label>
                                <input type="email" id="email" name="email" placeholder="alex@example.com" required>
                            </div>
                            <div class="row-2">
                                <div class="input-group">
                                    <label for="form">Current Form</label>
                                    <select id="form" name="form" required>
                                        <option value="" disabled selected>Select</option>
                                        <option value="Form 1">Form 1</option>
                                        <option value="Form 2">Form 2</option>
                                        <option value="Form 3">Form 3</option>
                                        <option value="Form 4">Form 4</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label for="country">Country</label>
                                    <input type="text" id="country" name="country" placeholder="e.g. Malawi" value="Malawi" required>
                                </div>
                            </div>
                            <button type="submit" class="btn">Complete registration</button>
                        </form>
                        <div class="switch-link">
                            <a id="backToCredentials">← Back to credentials</a>
                        </div>
                        <div class="small-note">All fields are required.</div>
                    `;
                }

                // ============================================================
                // 3. LOGIN (BEAUTIFUL)
                // ============================================================
                else if (currentView === 'login') {
                    html += `
                        <div class="login-card">
                            <div class="login-header">
                                <span class="icon">🎓</span>
                                <h2>Welcome Back</h2>
                                <div class="tagline">Sign in to continue learning from home</div>
                            </div>
                            <form id="loginForm" class="login-form" autocomplete="off">
                                <div class="input-group">
                                    <label for="loginUsername">Username</label>
                                    <input type="text" id="loginUsername" name="username" placeholder="your username" autocomplete="off" required>
                                </div>
                                <div class="input-group">
                                    <label for="loginPassword">Password</label>
                                    <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="off" required>
                                </div>
                                <button type="submit" class="btn-login">Log In</button>
                            </form>
                            <div class="login-divider">or</div>
                            <div class="login-switch">
                                New here? <a id="goToRegister">Create an account</a>
                            </div>
                            <div class="login-note">secure · local demo · Times New Roman</div>
                        </div>
                    `;
                }

                // ============================================================
                // 4. DASHBOARD : Subjects list
                // ============================================================
                else if (currentView === 'dashboard') {
                    const user = users[loggedInUser] || {};
                    const personal = user.personal || {};
                    const displayName = personal.fullName || loggedInUser;
                    const userForm = personal.form || 'Form 1';

                    const categories = ['All', ...new Set(SUBJECTS.map(s => s.category))];
                    const filtered = subjectFilter === 'All'
                        ? SUBJECTS
                        : SUBJECTS.filter(s => s.category === subjectFilter);

                    html += `
                        <div class="dashboard">
                            <div class="dash-topbar">
                                <div class="brand">
                                    <div class="brand-logo">🎓</div>
                                    <div class="brand-text">
                                        <h1>EduHome Malawi</h1>
                                        <p>Learn from home · anytime, anywhere</p>
                                    </div>
                                </div>
                                <div class="user-chip">
                                    <div class="who">Signed in as <strong>${escapeHtml(displayName)}</strong></div>
                                    <button class="logout-small" id="logoutBtn">Log out</button>
                                </div>
                            </div>

                            <div class="hero">
                                <div class="hero-grid">
                                    <div class="hero-text">
                                        <h2>Welcome to your <span>Home Learning Hub</span></h2>
                                        <p>Access complete secondary school subjects from the comfort of your home. Watch the video to see how to navigate the site, choose a subject, and start learning at your own pace.</p>
                                        <div class="hero-pills">
                                            <span class="hero-pill">📚 ${SUBJECTS.length} Subjects</span>
                                            <span class="hero-pill">🎯 ${escapeHtml(userForm)}</span>
                                            <span class="hero-pill">🏠 Home Learning</span>
                                            <span class="hero-pill">🇲🇼 Malawi Curriculum</span>
                                        </div>
                                    </div>
                                    <div class="video-wrapper">
                                        <span class="video-badge">▶ How to navigate</span>
                                        <iframe 
                                            src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&modestbranding=1" 
                                            title="How to navigate the EduHome website"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowfullscreen>
                                        </iframe>
                                    </div>
                                </div>
                            </div>

                            <div class="subjects-section">
                                <div class="subjects-header">
                                    <h3>📖 Secondary School Subjects</h3>
                                    <span class="count">${filtered.length} of ${SUBJECTS.length} subjects</span>
                                </div>

                                <div class="subject-filters" id="subjectFilters">
                                    ${categories.map(cat => `
                                        <span class="filter-chip ${subjectFilter === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</span>
                                    `).join('')}
                                </div>

                                <div class="subjects-grid" id="subjectsGrid">
                                    ${filtered.length === 0 ? `<div class="no-results">🔍 No subjects in this category.</div>` : ''}
                                    ${filtered.map(sub => `
                                        <div class="subject-card">
                                            <div class="subject-icon">${sub.icon}</div>
                                            <h4>${escapeHtml(sub.name)}</h4>
                                            <p>${escapeHtml(sub.desc)}</p>
                                            <div class="subject-meta">
                                                <span class="level">${escapeHtml(sub.level)}</span>
                                                <span class="lessons">${sub.lessons} lessons</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }

                app.innerHTML = html;

                // ---------- attach event listeners ----------

                // ----- credentials step -----
                if (currentView === 'register-credentials') {
                    const form = document.getElementById('credentialsForm');
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const username = document.getElementById('regUsername').value.trim();
                        const password = document.getElementById('regPassword').value;

                        if (!username) { setMessage('error', 'Username cannot be empty.'); return; }
                        if (password.length < 4) { setMessage('error', 'Password must be at least 4 characters.'); return; }

                        const users = getUsers();
                        if (users[username]) { setMessage('error', `Username “${escapeHtml(username)}” is already taken.`); return; }

                        pendingUsername = username;
                        pendingPassword = password;
                        currentView = 'register-personal';
                        message = null;
                        render();
                    });

                    const loginLink = document.getElementById('goToLoginFromReg');
                    if (loginLink) {
                        loginLink.addEventListener('click', (e) => {
                            e.preventDefault();
                            currentView = 'login';
                            message = null;
                            render();
                        });
                    }
                }

                // ----- personal details step -----
                else if (currentView === 'register-personal') {
                    const form = document.getElementById('personalForm');
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();

                        const fullName = document.getElementById('fullName').value.trim();
                        const age = document.getElementById('age').value.trim();
                        const gender = document.getElementById('gender').value;
                        const email = document.getElementById('email').value.trim();
                        const userForm = document.getElementById('form').value;
                        const country = document.getElementById('country').value.trim();

                        if (!fullName || !age || !gender || !email || !userForm || !country) {
                            setMessage('error', 'Please fill in all personal details.');
                            return;
                        }

                        const ageNum = Number(age);
                        if (isNaN(ageNum) || ageNum < 5 || ageNum > 120) {
                            setMessage('error', 'Please enter a valid age (5–120).');
                            return;
                        }

                        const users = getUsers();
                        if (users[pendingUsername]) {
                            setMessage('error', 'This username was just taken. Please start over.');
                            currentView = 'register-credentials';
                            pendingUsername = null;
                            pendingPassword = null;
                            render();
                            return;
                        }

                        users[pendingUsername] = {
                            password: pendingPassword,
                            personal: { fullName, age: ageNum, gender, email, form: userForm, country }
                        };
                        saveUsers(users);

                        setMessage('success', `✅ Account “${escapeHtml(pendingUsername)}” created successfully! Please log in.`);
                        pendingUsername = null;
                        pendingPassword = null;
                        currentView = 'login';
                        render();
                    });

                    const backLink = document.getElementById('backToCredentials');
                    if (backLink) {
                        backLink.addEventListener('click', (e) => {
                            e.preventDefault();
                            currentView = 'register-credentials';
                            pendingUsername = null;
                            pendingPassword = null;
                            message = null;
                            render();
                        });
                    }
                }

                // ----- login view -----
                else if (currentView === 'login') {
                    const form = document.getElementById('loginForm');
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const username = document.getElementById('loginUsername').value.trim();
                        const password = document.getElementById('loginPassword').value;

                        if (!username || !password) { setMessage('error', 'Both username and password are required.'); return; }

                        const users = getUsers();
                        if (!users[username]) { setMessage('error', 'No account with that username. Please register.'); return; }
                        if (users[username].password !== password) { setMessage('error', 'Incorrect password. Try again.'); return; }

                        loggedInUser = username;
                        currentView = 'dashboard';
                        subjectFilter = 'All';
                        message = { type: 'success', text: `Welcome back, ${username}! Start learning from home.` };

                        if (messageTimer) clearTimeout(messageTimer);
                        messageTimer = setTimeout(() => {
                            if (message && message.text.includes('Welcome back')) {
                                message = null;
                                if (currentView === 'dashboard') render();
                            }
                        }, 4500);

                        render();
                    });

                    const regLink = document.getElementById('goToRegister');
                    if (regLink) {
                        regLink.addEventListener('click', (e) => {
                            e.preventDefault();
                            currentView = 'register-credentials';
                            message = null;
                            pendingUsername = null;
                            pendingPassword = null;
                            render();
                        });
                    }
                }

                // ----- dashboard (logout + subject filters) -----
                else if (currentView === 'dashboard') {
                    const logoutBtn = document.getElementById('logoutBtn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', () => {
                            loggedInUser = null;
                            currentView = 'login';
                            subjectFilter = 'All';
                            message = { type: 'info', text: 'You have been logged out.' };
                            if (messageTimer) clearTimeout(messageTimer);
                            messageTimer = setTimeout(() => {
                                if (message && message.text === 'You have been logged out.') {
                                    message = null;
                                    if (currentView === 'login') render();
                                }
                            }, 3000);
                            render();
                        });
                    }

                    // Subject category filter chips
                    const filterChips = document.querySelectorAll('#subjectFilters .filter-chip');
                    filterChips.forEach(chip => {
                        chip.addEventListener('click', () => {
                            subjectFilter = chip.dataset.category;
                            render();
                        });
                    });
                }
            }

            // ---------- start the app ----------
            currentView = 'register-credentials';
            render();
        })();
    </script>
</body>
</html>
